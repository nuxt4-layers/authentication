name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Disposable database for integration tests (ADR-0002); never a hosted one.
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTHENTICATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # Theme Manager (a pinned devDependency for the playground and e2e suite)
      # is a private repository. A fine-grained, read-only token for the
      # nuxt4-layers organisation is scoped to these URL rewrites only, written
      # to a throwaway Git config that exists only for the install step, so no
      # later step (which runs the pull request's own code) can read it.
      # Pull requests from forks receive no secrets; see CONTRIBUTING.md.
      - name: Authorise read access to nuxt4-layers repositories
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/nuxt4-layers.gitconfig
          NUXT4_LAYERS_READ_TOKEN: ${{ secrets.NUXT4_LAYERS_READ_TOKEN }}
        run: |
          if [ -z "$NUXT4_LAYERS_READ_TOKEN" ]; then
            echo "::error::The NUXT4_LAYERS_READ_TOKEN secret is unavailable (pull requests from forks do not receive secrets). See CONTRIBUTING.md."
            exit 1
          fi
          base="https://x-access-token:${NUXT4_LAYERS_READ_TOKEN}@github.com/nuxt4-layers/"
          git config --global url."$base".insteadOf "git@github.com:nuxt4-layers/"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/nuxt4-layers/"
          git config --global --add url."$base".insteadOf "https://github.com/nuxt4-layers/"
      - name: Install dependencies
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/nuxt4-layers.gitconfig
        run: pnpm install --frozen-lockfile
      - name: Remove the read token
        if: always()
        run: rm -f "$RUNNER_TEMP/nuxt4-layers.gitconfig"
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
